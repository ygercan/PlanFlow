name: Android Atomic APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure .env from GitHub Secrets
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${SECRET_SUPABASE_URL:-https://your-project.supabase.co}
          SUPABASE_ANON_KEY=${SECRET_SUPABASE_ANON_KEY:-your-supabase-anon-key}
          GITHUB_OWNER=${{ github.repository_owner }}
          GITHUB_REPO=${{ github.event.repository.name }}
          EOF

      - name: Determine Release Tag & Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VER_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
            VER_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode = [0-9]*/versionCode = ${GITHUB_RUN_NUMBER}/g" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VER_NAME}\"/g" app/build.gradle.kts

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug \
              -Dorg.gradle.configuration-cache=false \
              -Dkotlin.compiler.execution.strategy=daemon \
              -Pksp.incremental=false \
              --stacktrace
          else
            gradle assembleDebug \
              -Dorg.gradle.configuration-cache=false \
              -Dkotlin.compiler.execution.strategy=daemon \
              -Pksp.incremental=false \
              --stacktrace
          fi

      - name: Rename APK for Release Asset
        id: apk
        run: |
          APK_NAME="PlanFlow-${{ steps.version.outputs.tag_name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "apk_path=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "PlanFlow ${{ steps.version.outputs.tag_name }}"
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
